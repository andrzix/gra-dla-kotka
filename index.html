<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-touch-fullscreen" content="yes">
<title>Emi i Lampart</title>
<link rel="manifest" href="manifest.json">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden; background: #000;
  font-family: Georgia, 'Times New Roman', serif;
}

/* ── TITLE SCREEN ── */
#title-screen {
  position: fixed; inset: 0; z-index: 200;
  background: radial-gradient(ellipse at 50% 40%, #1a003a 0%, #0a0015 60%, #000005 100%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: white; text-align: center; padding: 40px;
}
.title-cats { font-size: 5em; margin-bottom: 16px; filter: drop-shadow(0 0 20px rgba(224,170,255,0.6)); }
.title-h1 {
  font-size: 2.4em; color: #e0aaff; margin-bottom: 8px;
  text-shadow: 0 0 30px rgba(224,170,255,0.5);
}
.title-sub { color: rgba(255,255,255,0.45); font-size: 0.95em; font-style: italic; margin-bottom: 50px; }
.title-btn {
  background: rgba(224,170,255,0.12); border: 1px solid rgba(224,170,255,0.45);
  border-radius: 14px; color: #e0aaff; padding: 14px 44px;
  font-family: Georgia, serif; font-size: 1.05em; cursor: pointer;
  margin: 7px; -webkit-appearance: none; transition: background 0.2s;
  display: block; width: 220px;
}
.title-btn:active { background: rgba(224,170,255,0.25); }
.title-btn.secondary { color: rgba(255,255,255,0.5); border-color: rgba(255,255,255,0.2); font-size: 0.9em; padding: 11px 44px; }

/* ── CHAPTER CARD ── */
#chapter-card {
  position: fixed; inset: 0; z-index: 150;
  background: rgba(0,0,0,0.97);
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  color: white; text-align: center; padding: 40px;
}
.ch-label { color: rgba(255,255,255,0.35); font-size: 0.75em; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 14px; }
.ch-name { color: #e0aaff; font-size: 2em; text-shadow: 0 0 20px rgba(224,170,255,0.4); }
.ch-emoji { font-size: 3em; margin-bottom: 20px; }

/* ── FADE OVERLAY ── */
#fade {
  position: fixed; inset: 0; z-index: 100;
  background: black; opacity: 0; pointer-events: none;
  transition: opacity 0.45s ease;
}
#fade.on { opacity: 1; pointer-events: all; }

/* ── GAME ── */
#game { position: fixed; inset: 0; display: flex; flex-direction: column; }

#bg {
  position: absolute; inset: 0; z-index: 0;
  transition: background 0.8s ease;
}
#bg::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.88) 35%, rgba(0,0,0,0.15) 100%);
}

#scene {
  position: relative; z-index: 1;
  height: 100%; display: flex; flex-direction: column;
  justify-content: flex-end;
  padding-bottom: env(safe-area-inset-bottom, 0);
}

/* location label */
#location {
  position: absolute; top: max(20px, env(safe-area-inset-top, 20px));
  left: 20px; right: 80px;
  color: rgba(255,255,255,0.5); font-size: 0.72em;
  letter-spacing: 1.5px; text-transform: uppercase;
}

/* inventory */
#inventory {
  position: absolute; top: max(14px, env(safe-area-inset-top, 14px));
  right: 16px; display: flex; gap: 4px; font-size: 1.4em;
}
.inv-item { cursor: default; }

/* character */
#character {
  position: absolute; left: 50%; top: 42%;
  transform: translate(-50%, -50%);
  font-size: 5.5em;
  filter: drop-shadow(0 0 18px rgba(255,255,255,0.25));
  transition: opacity 0.4s; pointer-events: none;
  user-select: none;
}

/* text box */
#textbox {
  background: rgba(0,0,0,0.72);
  border-top: 1px solid rgba(255,255,255,0.12);
  padding: 18px 20px 4px;
  min-height: 150px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
#speaker {
  color: #c084fc; font-size: 0.82em; letter-spacing: 0.8px;
  margin-bottom: 7px; min-height: 18px;
}
#text { color: #e2e2e2; font-size: 0.97em; line-height: 1.65; }

/* choices */
#choices { padding: 10px 18px 4px; display: flex; flex-direction: column; gap: 8px; }
.choice-btn {
  background: rgba(255,255,255,0.07); border: 1px solid rgba(192,132,252,0.38);
  border-radius: 11px; color: #dda6ff; padding: 13px 16px;
  font-family: Georgia, serif; font-size: 0.9em; text-align: left;
  cursor: pointer; -webkit-appearance: none; transition: background 0.15s;
  min-height: 44px;
}
.choice-btn:active { background: rgba(192,132,252,0.18); border-color: #c084fc; }

/* continue hint */
#continue-hint {
  color: rgba(255,255,255,0.3); font-size: 0.78em; text-align: center;
  padding: 10px 20px 14px; cursor: pointer; min-height: 44px;
  display: flex; align-items: center; justify-content: center;
  letter-spacing: 1px;
}
@keyframes blink { 0%,100%{opacity:0.3} 50%{opacity:0.8} }
#continue-hint.visible { animation: blink 2s infinite; }

/* ── BACKGROUNDS ── */
.bg-airport-night { background: linear-gradient(160deg, #040412 0%, #0a1428 50%, #0d1e3a 100%); }
.bg-cargo-dark { background: linear-gradient(180deg, #020208 0%, #04040e 60%, #080814 100%); }
.bg-africa { background: linear-gradient(180deg, #c85000 0%, #e87000 30%, #d4820a 60%, #7a3d00 100%); }
.bg-middle-east { background: linear-gradient(180deg, #0d0700 0%, #2a1200 40%, #5c2e00 80%, #3d1f00 100%); }
.bg-home-emi { background: linear-gradient(160deg, #1e0d3a 0%, #2a1050 40%, #1a0830 100%); }
.bg-kotkopomost { background: linear-gradient(180deg, #000022 0%, #110033 25%, #330066 50%, #110033 75%, #000022 100%); }
.bg-kotkoland { background: radial-gradient(ellipse at 50% 25%, #550099 0%, #1a0044 50%, #05000f 100%); }
.bg-centrum { background: linear-gradient(135deg, #001020 0%, #001a30 50%, #002240 100%); }
.bg-tunnel { background: linear-gradient(180deg, #010106 0%, #030310 80%, #050518 100%); }
</style>
</head>
<body>

<!-- TITLE -->
<div id="title-screen">

  <button class="title-btn" onclick="startGame()">Nowa przygoda</button>

<!-- CHAPTER CARD -->

// ═══════════════════════════════════════════════════
// ENGINE
// ═══════════════════════════════════════════════════

const $ = id => document.getElementById(id);

function fade(cb) {
  const f = $('fade');
  f.classList.add('on');
  setTimeout(() => { cb(); setTimeout(() => f.classList.remove('on'), 80); }, 440);
}

function showChapterCard(scene) {
  const card = $('chapter-card');
  $('ch-emoji').textContent = scene.emoji || '✨';
  $('ch-label').textContent = scene.label;
  $('ch-name').textContent = scene.name;
  card.style.display = 'flex';
  setTimeout(() => {
    card.style.display = 'none';
    render(scene.nxt);
  }, 2600);
}

function render(id) {
  const sc = S[id];
  if (!sc) return;

  G.scene = id;
  save();

  if (sc.chapter) { showChapterCard(sc); return; }

  if (sc.endChapter) {
    const card = $('chapter-card');
    $('ch-emoji').textContent = sc.emoji || '✨';
    $('ch-label').textContent = sc.label;
    $('ch-name').textContent = sc.name;
    card.style.display = 'flex';
    return;
  }

  if (sc.item && !G.inventory.includes(sc.item)) {
    G.inventory.push(sc.item);
    save();
  }

  // background
  const bg = $('bg');
  bg.className = sc.bg ? 'bg-' + sc.bg : '';

  $('location').textContent = sc.loc || '';
  $('character').textContent = sc.char || '';
  $('speaker').textContent = sc.spk || '';
  $('text').textContent = sc.txt || '';

  // inventory display
  $('inventory').innerHTML = G.inventory.map(i => `<span class="inv-item" title="${i}">${i}</span>`).join('');

  // choices / continue
  const choicesEl = $('choices');
  const hint = $('continue-hint');
  choicesEl.innerHTML = '';
  hint.textContent = '';
  hint.className = 'visible' in hint.classList ? hint.className : '';
  hint.onclick = null;

  if (sc.choices) {
    hint.textContent = '';
    hint.className = '';
    sc.choices.forEach(ch => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = ch.txt;
      btn.onclick = () => {
        if (ch.flag) G.flags[ch.flag] = true;
        if (ch.item && !G.inventory.includes(ch.item)) G.inventory.push(ch.item);
        fade(() => render(ch.nxt));
      };
      choicesEl.appendChild(btn);
    });
  } else if (sc.nxt) {
    hint.textContent = '▼ dotknij aby kontynuować';
    hint.className = 'visible';
    hint.onclick = () => fade(() => render(sc.nxt));
  }
}

function advance() { /* handled by onclick */ }

function startGame() {
  G = { scene: 'p01', inventory: [], flags: {} };
  $('title-screen').style.display = 'none';
  render('p01');
}

function loadGame() {
  try {
    const d = JSON.parse(localStorage.getItem('el_save'));
    if (d) { G = d; $('title-screen').style.display = 'none'; render(G.scene); }
  } catch(e) {}
}

function save() {
  try { localStorage.setItem('el_save', JSON.stringify(G)); } catch(e) {}
}

// check for save on load
window.addEventListener('load', () => {
  if (localStorage.getItem('el_save')) $('load-btn').style.display = 'block';
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
});
</script>
